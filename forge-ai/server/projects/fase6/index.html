<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interativo - Fase 6</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 min-h-screen text-slate-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl p-8 text-center relative overflow-hidden">
        
        <!-- Elemento decorativo de fundo -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Cabeçalho -->
        <div class="mb-8 relative z-10">
            <span class="inline-block px-3 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold rounded-full uppercase tracking-wider mb-3">
                Fase 6 • Aplicação Web
            </span>
            <h1 class="text-3xl font-bold tracking-tight text-white">Contador Interativo</h1>
            <p class="text-slate-400 text-sm mt-1">Experimente interagir com os botões abaixo</p>
        </div>

        <!-- Display do Contador -->
        <div class="bg-slate-950/60 border border-slate-800 rounded-2xl py-8 px-6 mb-8 relative z-10 shadow-inner">
            <div class="text-xs uppercase tracking-widest text-slate-500 font-medium mb-1">Total Atual</div>
            <div id="counter-display" class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 transition-all duration-200 transform scale-100">
                0
            </div>
            <div id="status-message" class="text-xs text-indigo-400/80 mt-2 font-medium h-4">Comece a contar!</div>
        </div>

        <!-- Botões de Ação -->
        <div class="grid grid-cols-3 gap-3 mb-6 relative z-10">
            <button id="btn-decrement" class="flex items-center justify-center py-3.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700/60 rounded-xl font-bold text-lg text-slate-200 transition-all shadow-md cursor-pointer group">
                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
            </button>
            
            <button id="btn-reset" class="flex items-center justify-center py-3.5 px-4 bg-slate-800/80 hover:bg-slate-700/80 active:scale-95 border border-slate-700/60 rounded-xl font-semibold text-xs text-slate-300 transition-all shadow-md cursor-pointer uppercase tracking-wider">
                Reset
            </button>

            <button id="btn-increment" class="flex items-center justify-center py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white rounded-xl font-bold text-lg transition-all shadow-lg shadow-indigo-600/30 cursor-pointer group">
                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

        <!-- Ações Rápidas Extras -->
        <div class="flex gap-2 justify-center text-xs text-slate-400 relative z-10">
            <button id="btn-plus-10" class="px-3 py-1.5 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/40 rounded-lg transition-colors cursor-pointer">+10</button>
            <button id="btn-minus-10" class="px-3 py-1.5 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/40 rounded-lg transition-colors cursor-pointer">-10</button>
        </div>

        <!-- Rodapé -->
        <div class="mt-8 pt-4 border-t border-slate-800/80 text-xs text-slate-500 relative z-10">
            Criado com Tailwind CSS e JavaScript Vanilla
        </div>
    </div>

    <!-- Script de Interatividade -->
    <script>
        let count = 0;

        const display = document.getElementById('counter-display');
        const statusMsg = document.getElementById('status-message');
        const btnIncrement = document.getElementById('btn-increment');
        const btnDecrement = document.getElementById('btn-decrement');
        const btnReset = document.getElementById('btn-reset');
        const btnPlus10 = document.getElementById('btn-plus-10');
        const btnMinus10 = document.getElementById('btn-minus-10');

        function updateDisplay(delta = 0) {
            display.textContent = count;
            
            // Animação subtil ao atualizar
            display.classList.add('scale-110');
            setTimeout(() => {
                display.classList.remove('scale-110');
            }, 150);

            // Mensagens dinâmicas
            if (count === 0) {
                statusMsg.textContent = "Comece a contar!";
                statusMsg.className = "text-xs text-indigo-400/80 mt-2 font-medium h-4";
            } else if (count > 0 && count < 10) {
                statusMsg.textContent = "Bom ritmo!";
                statusMsg.className = "text-xs text-emerald-400/90 mt-2 font-medium h-4";
            } else if (count >= 10) {
                statusMsg.textContent = "Excelente progresso! 🎉";
                statusMsg.className = "text-xs text-purple-400/90 mt-2 font-medium h-4";
            } else {
                statusMsg.textContent = "Valores negativos permitidos";
                statusMsg.className = "text-xs text-amber-400/90 mt-2 font-medium h-4";
            }
        }

        btnIncrement.addEventListener('click', () => {
            count += 1;
            updateDisplay(1);
        });

        btnDecrement.addEventListener('click', () => {
            count -= 1;
            updateDisplay(-1);
        });

        btnReset.addEventListener('click', () => {
            count = 0;
            updateDisplay(0);
        });

        btnPlus10.addEventListener('click', () => {
            count += 10;
            updateDisplay(10);
        });

        btnMinus10.addEventListener('click', () => {
            count -= 10;
            updateDisplay(-10);
        });

        // Suporte a teclado opcional para melhor acessibilidade
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === '+') {
                count += 1;
                updateDisplay(1);
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                count -= 1;
                updateDisplay(-1);
            } else if (e.key === 'r' || e.key === 'R') {
                count = 0;
                updateDisplay(0);
            }
        });
    </script>
</body>
</html>
